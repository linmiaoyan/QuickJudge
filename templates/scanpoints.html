<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫描点管理 · QuickJudge</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        :root{
            --text:#111827; --text2:#4b5563; --muted:#5f6b7a; --line:#e5e7eb;
            --primary:#2563eb; --danger-ink:#b91c1c; --ok-ink:#047857;
        }
        *{box-sizing:border-box}
        body{
            margin:0; background:#f5f7fa; color:var(--text); padding:28px 20px 60px;
            font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; font-size:14px;
        }
        .wrap{max-width:820px; margin:0 auto;}
        h1{font-size:20px; margin:0 0 6px; letter-spacing:-.3px;}
        .sub{color:var(--text2); font-size:13px; line-height:1.7; margin:0 0 22px;}
        .panel{
            background:#fff; border:1px solid var(--line); border-radius:12px;
            padding:18px; margin-bottom:16px;
        }
        .row{display:flex; gap:10px; flex-wrap:wrap;}
        input[type=text]{
            flex:1 1 220px; min-width:0; padding:10px 12px; border:1px solid var(--line);
            border-radius:9px; font-size:14px; font-family:inherit; color:var(--text);
        }
        input[type=text]:focus{outline:2px solid #bfdbfe; outline-offset:1px; border-color:#93c5fd;}
        .btn{
            padding:10px 16px; border-radius:9px; border:1px solid var(--line); background:#fff;
            color:var(--text); font-size:13.5px; font-family:inherit; cursor:pointer; min-height:40px;
        }
        .btn:hover{background:#f9fafb;}
        .btn.primary{background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600;}
        .btn.primary:hover{background:#1d4ed8;}
        .btn.tiny{padding:6px 10px; font-size:12.5px; min-height:30px; border-radius:7px;}
        .btn.danger{color:var(--danger-ink); border-color:#fecaca;}
        .btn.danger:hover{background:#fef2f2;}
        table{width:100%; border-collapse:collapse; font-size:13.5px;}
        th{
            text-align:left; font-weight:600; color:var(--text2); font-size:12.5px;
            padding:0 0 10px; border-bottom:1px solid var(--line);
        }
        td{padding:12px 0; border-bottom:1px solid #f1f3f5; vertical-align:middle;}
        tr:last-child td{border-bottom:0;}
        .name{font-weight:600;}
        .meta{color:var(--muted); font-size:12.5px;}
        .live{color:var(--ok-ink); font-weight:600;}
        .stale{color:var(--muted);}
        .empty{color:var(--muted); text-align:center; padding:26px 0; font-size:13px;}
        .tip{
            margin-top:14px; padding:12px 14px; border-radius:9px; background:#f0f7ff;
            border:1px solid #cfe3ff; color:#1e3a5f; font-size:12.5px; line-height:1.75;
        }
        .toast{
            position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
            background:#111827; color:#fff; padding:10px 16px; border-radius:9px;
            font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none;
        }
        .toast.on{opacity:1;}
    </style>
</head>
<body>
<div class="wrap">
    <h1>扫描点管理</h1>
    <p class="sub">
        给每台要接扫描仪的电脑建一个扫描点，然后在<b>那台电脑</b>上打开它的安装链接。
        扫描点只负责出图并上传，批阅与数据都在这一台服务器上。
    </p>

    <div class="panel">
        <div class="row">
            <input type="text" id="newName" placeholder="扫描点名称，例如「1 号扫描点（七年级）」"
                   aria-label="新扫描点名称" maxlength="40">
            <button class="btn primary" id="addBtn">添加扫描点</button>
        </div>
        <div class="tip">
            名称会显示在扫描点自己的页面上，也会跟着批次一起进后台 —— 建议带上年级或位置，好认。
        </div>
    </div>

    <div class="panel">
        <table>
            <thead>
            <tr><th style="width:34%;">扫描点</th><th style="width:28%;">上次活动</th><th></th></tr>
            </thead>
            <tbody id="list">
            <tr><td colspan="3" class="empty">正在加载…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
    var list = document.getElementById('list');

    function toast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('on');
        setTimeout(function () { t.classList.remove('on'); }, 2200);
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    // 30 分钟内算在线：看护用的是同一套探活节奏，没必要更细
    function online(last) {
        if (!last) return false;
        var t = Date.parse(String(last).replace(/-/g, '/'));
        return t && (Date.now() - t) < 30 * 60 * 1000;
    }

    function render(points) {
        if (!points.length) {
            list.innerHTML = '<tr><td colspan="3" class="empty">还没有扫描点。上面加一个，' +
                '再去那台电脑上打开安装链接。</td></tr>';
            return;
        }
        list.innerHTML = points.map(function (p) {
            var live = online(p.last_seen);
            return '<tr>' +
                '<td><div class="name">' + esc(p.name) + '</div>' +
                    '<div class="meta">编号 ' + esc(p.id) + '</div></td>' +
                '<td class="' + (live ? 'live' : 'stale') + '">' +
                    (p.last_seen ? (live ? '● ' : '') + esc(p.last_seen) : '还没用过') + '</td>' +
                '<td style="text-align:right;">' +
                    '<button class="btn tiny" data-link="' + esc(p.id) + '">复制安装链接</button> ' +
                    '<button class="btn tiny danger" data-del="' + esc(p.id) + '">删除</button>' +
                '</td></tr>';
        }).join('');
    }

    function load() {
        fetch('/api/scanpoints').then(function (r) { return r.json(); }).then(function (j) {
            if (j.error) { toast(j.error); return; }
            render(j.points || []);
        }).catch(function () { toast('读取失败'); });
    }

    document.getElementById('addBtn').onclick = function () {
        var name = document.getElementById('newName').value.trim();
        if (!name) { document.getElementById('newName').focus(); return; }
        this.disabled = true;
        var self = this;
        fetch('/api/scanpoints', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name })
        }).then(function (r) { return r.json(); }).then(function (j) {
            self.disabled = false;
            if (j.error) { toast(j.error); return; }
            document.getElementById('newName').value = '';
            toast('已添加，点「复制安装链接」拿到那台电脑上用');
            load();
        }).catch(function () { self.disabled = false; toast('添加失败'); });
    };

    list.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.link) {
            fetch('/api/scanpoints/' + b.dataset.link + '/link')
                .then(function (r) { return r.json(); })
                .then(function (j) {
                    if (j.error) { toast(j.error); return; }
                    var done = function () { toast('链接已复制，去那台电脑的浏览器打开它'); };
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(j.link).then(done, function () { prompt('复制这个链接', j.link); });
                    } else {
                        prompt('复制这个链接', j.link);
                    }
                });
        } else if (b.dataset.del) {
            if (!confirm('删除后这台电脑就传不上来了，确定？')) return;
            fetch('/api/scanpoints/' + b.dataset.del, { method: 'DELETE' })
                .then(function (r) { return r.json(); })
                .then(function (j) {
                    if (j.error) { toast(j.error); return; }
                    toast('已删除'); load();
                });
        }
    });

    load();
})();
</script>
</body>
</html>
